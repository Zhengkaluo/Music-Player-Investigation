    function filtered(){const q=state.search.trim().toLocaleLowerCase();return DATA.songs.filter(song=>{if(q&&![song.title,song.artist,song.album].join(' ').toLocaleLowerCase().includes(q))return false;if(state.artist!=='all'&&song.artist!==state.artist)return false;if(state.status==='pending'&&done(song.id))return false;if(state.status==='done'&&!done(song.id))return false;return true}).sort((a,b)=>a.artist.localeCompare(b.artist)||a.title.localeCompare(b.title))}
    function metrics(){const completed=DATA.songs.filter(song=>done(song.id)).length,total=DATA.songs.length,rate=total?completed/total*100:0;$('total').textContent=total;$('completed').textContent=completed;$('remaining').textContent=total-completed;$('rate').textContent=`${rate.toFixed(1)}%`;$('progress').style.width=`${rate}%`;$('export').disabled=completed===0}
    function renderQueue(){const rows=filtered();if(!rows.some(song=>song.id===state.activeId)){state.activeId=rows[0]?.id||null}$('queueHead').textContent=`当前筛选 ${rows.length} / ${DATA.songs.length} 首`;$('queue').innerHTML=rows.length?rows.map(song=>`<button class="queue-item${song.id===state.activeId?' active':''}${done(song.id)?' done':''}" type="button" data-id="${esc(song.id)}"><div class="queue-title"><span>${esc(song.title)}</span><i></i></div><div class="meta">${esc(song.artist)} · ${esc(song.album||'未标注专辑')}</div></button>`).join(''):'<div class="empty">当前筛选没有曲目。</div>';document.querySelectorAll('[data-id]').forEach(button=>button.addEventListener('click',()=>{state.activeId=button.dataset.id;render()}))}
    function option(value,label,current){return `<option value="${esc(value)}"${value===current?' selected':''}>${esc(label)}</option>`}
    function weakSignals(song){const tags=(song.candidate?.matched_tags||[]).map(item=>item.tag).filter(Boolean);const errors=(song.candidate?.errors||[]).map(item=>typeof item==='string'?item:(item.error||item.message)).filter(Boolean);return `<div class="reason"><b>没有形成主风格候选。</b>${tags.length?`<div class="signals">${[...new Set(tags)].slice(0,10).map(tag=>`<span class="signal">${esc(tag)}</span>`).join('')}</div>`:''}${errors.length?`<div style="margin-top:7px">查询信息：${esc(errors.join('；'))}</div>`:''}</div>`}
    function renderEditor(){const song=DATA.songs.find(item=>item.id===state.activeId);if(!song){$('editor').innerHTML='<div class="empty">当前筛选没有可编辑的曲目。</div>';return}const value=review(song.id);const genreOptions=[option('','请选择主 Tag',value.genre),...DATA.taxonomy.genres.map(g=>option(g,g,value.genre))].join('');const secondary=DATA.taxonomy.genres.map(g=>{const disabled=g===value.genre,checked=value.secondary_genres.includes(g)&&!disabled;return `<label class="${disabled?'disabled':''}"><input type="checkbox" data-secondary="${esc(g)}"${checked?' checked':''}${disabled?' disabled':''}>${esc(g)}</label>`}).join('');const languageOptions=[option('','默认中文/英文或未知',value.language),...DATA.taxonomy.languages.map(g=>option(g,g,value.language))].join('');const instrumentalOptions=option('','未知',value.instrumental===null?'':String(value.instrumental))+option('true','Instrumental',String(value.instrumental))+option('false','非器乐',String(value.instrumental));const external=song.youtube||song.bilibili||song.qq_music;const media=song.audio_url?`<audio controls src="${esc(song.audio_url)}"></audio>`:external?`<a class="button external" href="${esc(external)}" target="_blank" rel="noopener">↗ 外部播放</a>`:'<span class="meta">暂无可用播放链接</span>';$('editor').innerHTML=`<div class="song-head"><h2>${esc(song.title)}</h2><div class="meta">${esc(song.artist)} · ${esc(song.album||'未标注专辑')} · ${esc(song.id)}</div><div class="media-action">${media}</div></div>${weakSignals(song)}<div class="form-grid"><div class="field"><label>主 Tag（完成标注所必需）</label><select id="genreField">${genreOptions}</select></div><div class="field"><label>器乐状态</label><select id="instrumentalField">${instrumentalOptions}</select></div><div class="field full"><label>副 Tag（可选，最多两个）</label><div class="secondary">${secondary}</div></div><div class="field"><label>语言</label><select id="languageField">${languageOptions}</select></div><div class="field full"><label>备注（可选）</label><textarea id="noteField" placeholder="写下需要我入库时注意的判断…">${esc(value.note)}</textarea></div></div><div class="status${done(song.id)?' done':''}">${done(song.id)?'✓ 已完成并保存在本机':'选择主 Tag 后即计为完成；其他字段可以保持未知。'}</div><div class="editor-actions"><button class="button" id="clearCurrent" type="button">清空本首</button><div class="action-group"><button class="button" id="previous" type="button">上一首</button><button class="button primary" id="next" type="button">${done(song.id)?'下一首待处理':'下一首'}</button></div></div>`;
      $('genreField').addEventListener('change',event=>update(song.id,'genre',event.target.value||null,true));$('languageField').addEventListener('change',event=>update(song.id,'language',event.target.value||null,false));$('instrumentalField').addEventListener('change',event=>update(song.id,'instrumental',event.target.value===''?null:event.target.value==='true',false));$('noteField').addEventListener('input',event=>update(song.id,'note',event.target.value,false,false));document.querySelectorAll('[data-secondary]').forEach(node=>node.addEventListener('change',event=>toggleSecondary(song.id,node.dataset.secondary,event.target.checked)));$('clearCurrent').addEventListener('click',()=>clearCurrent(song.id));$('previous').addEventListener('click',()=>move(-1));$('next').addEventListener('click',()=>next(song.id));
    }
    function update(id,field,value,fullRender=false,showToast=true){const next={...review(id),[field]:value};if(field==='genre')next.secondary_genres=next.secondary_genres.filter(g=>g!==value);reviews[id]=next;persist();if(showToast)toast('已自动保存');if(fullRender)render();else metrics()}
    function toggleSecondary(id,genre,checked){const value=review(id);let items=value.secondary_genres.filter(g=>g!==value.genre);if(checked&&!items.includes(genre)){if(items.length>=2){toast('副 Tag 最多两个。',true);renderEditor();return}items.push(genre)}else if(!checked)items=items.filter(g=>g!==genre);reviews[id]={...value,secondary_genres:items};persist();metrics();toast('已自动保存')}
    function clearCurrent(id){if(!confirm('清空这首曲目的全部手动标注吗？'))return;delete reviews[id];persist();render();toast('本首标注已清空')}
    function visibleIds(){return filtered().map(song=>song.id)}
    function move(step){const ids=visibleIds(),index=ids.indexOf(state.activeId);if(!ids.length)return;state.activeId=ids[(Math.max(0,index)+step+ids.length)%ids.length];render()}
    function next(id){const pending=DATA.songs.filter(song=>!done(song.id)).sort((a,b)=>a.artist.localeCompare(b.artist)||a.title.localeCompare(b.title));const index=pending.findIndex(song=>song.id===id);state.activeId=pending[index>=0&&index+1<pending.length?index+1:0]?.id||visibleIds()[0]||null;render()}
    function exportJson(){const entries=DATA.songs.filter(song=>done(song.id)).map(song=>{const value=review(song.id);return {track_id:song.id,song:{title:song.title,artist:song.artist,album:song.album,qq_music:song.qq_music},resolved_tags:{genre:value.genre,secondary_genres:value.secondary_genres,language:value.language,instrumental:value.instrumental},note:value.note.trim()}});if(!entries.length){toast('还没有完成的标注可导出。',true);return}const payload={schema_version:'songbase.manual-tag-reviews/v1',exported_at:today(),purpose:'Human-authored tags for SongBase tracks without a genre candidate. This file does not update song_tags.json by itself.',source:{browser:'song_manual_tagging.html',library_date:DATA.library_date,tags_updated_at:DATA.tags_updated_at,taxonomy_version:DATA.taxonomy_version},summary:{queue_total:DATA.songs.length,completed:entries.length,remaining:DATA.songs.length-entries.length},reviews:entries};const url=URL.createObjectURL(new Blob([JSON.stringify(payload,null,2)+'\n'],{type:'application/json'}));const link=document.createElement('a');link.href=url;link.download=`song_manual_tags_${today()}.json`;link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast(`已导出 ${entries.length} 首完成标注`)}
    function render(){renderQueue();metrics();renderEditor()}
    function init(){const artists=[...new Set(DATA.songs.map(song=>song.artist))].sort((a,b)=>a.localeCompare(b));$('artist').innerHTML+=artists.map(a=>`<option value="${esc(a)}">${esc(a)}</option>`).join('');$('search').addEventListener('input',event=>{state.search=event.target.value;render()});$('artist').addEventListener('change',event=>{state.artist=event.target.value;render()});$('status').addEventListener('change',event=>{state.status=event.target.value;render()});$('export').addEventListener('click',exportJson);state.activeId=filtered()[0]?.id||DATA.songs[0]?.id||null;render()}
    init();
  </script>
</body>
</html>
